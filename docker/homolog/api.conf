# API da homologação — só acessível pela rede interna (o portal de teste encaminha /api, /admin etc. para cá).
server {
    listen 80;
    server_name _;

    index index.php index.html;
    root /var/www/public;
    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass comunidade_homolog_api:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;   # o acesso externo é sempre https (via proxy)
    }

    location ~ /\. { deny all; }
}
