# Detecta bots de redes sociais via map (http context)
map $http_user_agent $is_social_bot {
    default         0;
    ~*facebookexternalhit   1;
    ~*Twitterbot            1;
    ~*LinkedInBot           1;
    ~*WhatsApp              1;
    ~*Slackbot              1;
    ~*TelegramBot           1;
    ~*Discordbot            1;
    ~*pinterest             1;
    ~*vkShare               1;
}

server {
    listen 80;
    server_name ppg.comunidadeppg.com.br;

    root /usr/share/nginx/html;
    index index.html;

    # Resolver para proxy_pass com variáveis
    resolver 8.8.8.8 valid=300s ipv6=off;

    # Bot: serve o HTML do share diretamente via proxy (sem redirect)
    location ~ ^/eventos/(\d+)$ {
        set $item_id $1;
        if ($is_social_bot) {
            proxy_pass https://api.comunidadeppg.com.br/share/evento/$item_id;
        }
        try_files $uri /index.html;
    }

    location ~ ^/vagas/(\d+)$ {
        set $item_id $1;
        if ($is_social_bot) {
            proxy_pass https://api.comunidadeppg.com.br/share/vaga/$item_id;
        }
        try_files $uri /index.html;
    }

    location ~ ^/lojas/(\d+)$ {
        set $item_id $1;
        if ($is_social_bot) {
            proxy_pass https://api.comunidadeppg.com.br/share/loja/$item_id;
        }
        try_files $uri /index.html;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
