# Detecta bots de redes sociais via map (http context)
map $http_user_agent $is_social_bot {
    default         0;
    ~*facebookexternalhit   1;
    ~*Twitterbot            1;
    ~*LinkedInBot           1;
    ~*WhatsApp              1;
    ~*Slackbot              1;
    ~*TelegramBot           1;
    ~*Discordbot            1;
    ~*pinterest             1;
    ~*vkShare               1;
}

server {
    listen 80;
    server_name ppg.comunidadeppg.com.br;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno do Docker
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Bot: proxy interno para api_nginx (mesma rede Docker) — sem redirect
    location ~ ^/eventos/(\d+)$ {
        set $item_id $1;
        proxy_set_header Host api.comunidadeppg.com.br;
        if ($is_social_bot) {
            proxy_pass http://comunidade_api_nginx/share/evento/$item_id;
        }
        try_files $uri /index.html;
    }

    location ~ ^/vagas/(\d+)$ {
        set $item_id $1;
        proxy_set_header Host api.comunidadeppg.com.br;
        if ($is_social_bot) {
            proxy_pass http://comunidade_api_nginx/share/vaga/$item_id;
        }
        try_files $uri /index.html;
    }

    location ~ ^/lojas/(\d+)$ {
        set $item_id $1;
        proxy_set_header Host api.comunidadeppg.com.br;
        if ($is_social_bot) {
            proxy_pass http://comunidade_api_nginx/share/loja/$item_id;
        }
        try_files $uri /index.html;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
