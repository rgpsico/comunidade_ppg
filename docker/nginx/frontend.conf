server {
    listen 80;
    server_name ppg.comunidadeppg.com.br;

    root /usr/share/nginx/html;
    index index.html;

    # Bot detection — redireciona crawlers (Facebook, WhatsApp, etc.) para as rotas share da API
    location ~ ^/eventos/(\d+)$ {
        if ($http_user_agent ~* "facebookexternalhit|Twitterbot|LinkedInBot|WhatsApp|Slackbot|TelegramBot|Discordbot|pinterest|vkShare|W3C_Validator") {
            return 302 https://api.comunidadeppg.com.br/share/evento/$1;
        }
        try_files $uri /index.html;
    }

    location ~ ^/vagas/(\d+)$ {
        if ($http_user_agent ~* "facebookexternalhit|Twitterbot|LinkedInBot|WhatsApp|Slackbot|TelegramBot|Discordbot|pinterest|vkShare|W3C_Validator") {
            return 302 https://api.comunidadeppg.com.br/share/vaga/$1;
        }
        try_files $uri /index.html;
    }

    location ~ ^/lojas/(\d+)$ {
        if ($http_user_agent ~* "facebookexternalhit|Twitterbot|LinkedInBot|WhatsApp|Slackbot|TelegramBot|Discordbot|pinterest|vkShare|W3C_Validator") {
            return 302 https://api.comunidadeppg.com.br/share/loja/$1;
        }
        try_files $uri /index.html;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
